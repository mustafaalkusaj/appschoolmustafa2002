name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 159.203.120.28
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR=/var/www/school-app
            mkdir -p "$APP_DIR"
            REPO_ARCHIVE_URL=https://github.com/${{ github.repository }}/archive/refs/heads/main.tar.gz
            TMP_DIR=$(mktemp -d)
            trap 'rm -rf "$TMP_DIR"' EXIT
            curl -fsSL "$REPO_ARCHIVE_URL" -o "$TMP_DIR/repo.tar.gz"
            tar -xzf "$TMP_DIR/repo.tar.gz" -C "$TMP_DIR"
            SRC_DIR=$(find "$TMP_DIR" -maxdepth 1 -type d -name '*-main' | head -n 1)
            if [ -z "$SRC_DIR" ]; then
              echo "Unable to locate extracted repository directory." >&2
              exit 1
            fi
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete \
                --exclude ".env" \
                --exclude ".env.*" \
                --exclude "node_modules" \
                --exclude ".next" \
                "$SRC_DIR"/ "$APP_DIR"/
            else
              cp -a "$SRC_DIR"/. "$APP_DIR"/
            fi

            ENV_FILE="$APP_DIR/.env.production"
            touch "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            TMP_ENV_FILE=$(mktemp)
            grep -Ev '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|RBAC_COOKIE_SECRET)=' "$ENV_FILE" > "$TMP_ENV_FILE" || true
            {
              cat "$TMP_ENV_FILE"
              printf '%s\n' "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
              printf '%s\n' "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
              printf '%s\n' "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
              printf '%s\n' "RBAC_COOKIE_SECRET=${{ secrets.RBAC_COOKIE_SECRET }}"
            } > "$ENV_FILE"
            rm -f "$TMP_ENV_FILE"

            cd "$APP_DIR"
            npm ci
            npm run build

            if sudo -n systemctl restart pm2-deploy; then
              echo "pm2-deploy systemd service restarted."
            elif command -v pm2 >/dev/null 2>&1; then
              PM2_HOME=/home/deploy/.pm2 pm2 restart school-app
              PM2_HOME=/home/deploy/.pm2 pm2 save
            else
              echo "PM2 restart path unavailable." >&2
              exit 1
            fi

            ATTEMPT=1
            MAX_ATTEMPTS=20
            HEALTH_OK=0
            while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
              if curl -fsS http://127.0.0.1:3001/api/ping >/dev/null; then
                HEALTH_OK=1
                break
              fi
              echo "Health check attempt ${ATTEMPT}/${MAX_ATTEMPTS} failed."
              ATTEMPT=$((ATTEMPT + 1))
              sleep 3
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "Health check failed after ${MAX_ATTEMPTS} attempts. Collecting diagnostics..." >&2
              echo "---- curl /api/ping ----" >&2
              curl -isS http://127.0.0.1:3001/api/ping || true
              echo "---- curl /api/health ----" >&2
              curl -isS http://127.0.0.1:3001/api/health || true
              echo "---- systemctl status pm2-deploy ----" >&2
              sudo -n systemctl status pm2-deploy --no-pager || true
              echo "---- journalctl pm2-deploy ----" >&2
              sudo -n journalctl -u pm2-deploy -n 200 --no-pager || true
              if command -v pm2 >/dev/null 2>&1; then
                echo "---- pm2 status ----" >&2
                PM2_HOME=/home/deploy/.pm2 pm2 status || true
                echo "---- pm2 logs (school-app) ----" >&2
                PM2_HOME=/home/deploy/.pm2 pm2 logs school-app --lines 200 --nostream || true
              fi
              echo "---- listening sockets (3001) ----" >&2
              sudo -n ss -ltnp | grep ':3001 ' || true
              exit 1
            fi
